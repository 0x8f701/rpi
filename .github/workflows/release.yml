          echo "$rustc_version"
          case "$rustc_version" in
            "rustc 1.88.0 "*) ;;
            *) echo "Expected rustc 1.88.0" >&2; exit 1 ;;
          esac
          test -x /usr/bin/sandbox-exec


      - name: Set up Node for Chromium
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
