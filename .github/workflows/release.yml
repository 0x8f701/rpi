          cargo +1.88.0 test --locked -p pi-sandbox --lib prepare::macos::tests::pinned_target_fd_survives_sandbox_exec_and_path_replacement -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib seatbelt::tests::descriptor_process_exec_representation_is_exact -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib unix::tests::wrapper_and_child_error_channels_have_distinct_close_owners -- --nocapture
          cargo +1.88.0 test --locked -p pi-coding --test browser_native_sandbox governed_debugging_pipe_returns_browser_version -- --nocapture

  sandbox-windows-release:
    name: sandbox Windows release proof
    needs: [validate-release, build-web]
