name: Release

# On tag push v*, validate the release identity, build the embedded web bundle
# once, and publish three products:
#   CLI: rpi-<version>-<target>.{tar.gz|zip} for the five native targets
#     (x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu,
#     aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-msvc).
#   Desktop: Linux amd64/arm64 .deb, macOS arm64/x86_64 .zip, and Windows
#     x86_64 .zip. Each bundles the matching CLI binary. Packages are unsigned.
#   Mobile: one Android APK, rpi-chat-<version>-android.apk, containing
#     armeabi-v7a, arm64-v8a, x86, and x86_64. Signed from Actions secrets
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#     and ANDROID_KEY_PASSWORD. iOS is not published.
# Publication requires the static sandbox contracts plus Linux, macOS x64/arm64,
# and Windows runtime proofs, as well as every CLI, desktop, and Android asset.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail before packaging if debug metadata accidentally inflates a
  # distribution binary. The release-dist profile strips symbols and disables
  # debuginfo; `rpi` is a full agent CLI, so allow up to 64 MiB per native binary.
  MAX_RELEASE_BINARY_BYTES: "67108864"

jobs:

  validate-release:
    name: validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Validate semantic version tag and workspace version
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be semantic version vX.Y.Z: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')"
          if [ "$tag_version" != "$file_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml workspace version ($file_version)" >&2
            exit 1
          fi


  build-web:
    name: build web client bundle
    needs: [validate-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      # crates/pi-cli/build.rs embeds crates/pi-cli/web/dist (vite-plugin-singlefile
      # output). dist/ is generated build output and not tracked by git, so the
      # bundle is built ONCE here from the clean checkout, stamped against the
      # exact production inputs, and uploaded; build-linux and build-native
      # download it into their workspaces before cargo build — every build job
      # embeds the same deterministic bundle without repeating the npm install
      # (and without setup-node inside the Ubuntu 20.04 container).
      - name: Set up Node for Web build
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Generate embedded Web bundle
        shell: bash
        run: |
          cd crates/pi-cli/web
          npm ci --no-audit --no-fund
          npm run build
          python3 ../../../E2E.d/web/lib/web_dist_fingerprint.py stamp "$PWD" "$PWD/dist"


      - name: Upload embedded Web bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-dist
          path: crates/pi-cli/web/dist/
          if-no-files-found: error
          # stamp is dist/.rpi-web-source.sha256; v6 drops dotfiles unless opted in
          include-hidden-files: true


  build-linux:
    name: build (${{ matrix.target }})
    needs: [validate-release, build-web]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            expected_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            expected_arch: aarch64
    # Both GNU binaries are built and smoke-tested natively on Ubuntu 20.04
    # (glibc 2.31), establishing the documented minimum Linux runtime baseline.
    runs-on: ${{ matrix.os }}
    container:
      image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    steps:
      - name: Install Ubuntu 20.04 build and runtime tools
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --no-install-recommends -y \
            binutils \
            build-essential \
            ca-certificates \
            coreutils \
            curl \
            git \
            grep \
            gzip \
            libc-bin \
            sed \
            tar
          rm -rf /var/lib/apt/lists/*

          glibc_version="$(getconf GNU_LIBC_VERSION)"
          echo "Linux build baseline: $glibc_version"
          if [ "$glibc_version" != "glibc 2.31" ]; then
            echo "Expected the Ubuntu 20.04 glibc 2.31 baseline" >&2
            exit 1
          fi

          actual_arch="$(uname -m)"
          echo "Linux build architecture: $actual_arch"
          if [ "$actual_arch" != "${{ matrix.expected_arch }}" ]; then
            echo "Expected native ${{ matrix.expected_arch }} execution" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      # The embedded Web bundle is built once by build-web (dist/ is not
      # tracked by git); download it into the workspace before cargo build.
      - name: Download embedded Web bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: web-dist
          path: crates/pi-cli/web/dist

      - name: Install Rust 1.88.0
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              rustup_host=x86_64-unknown-linux-gnu
              rustup_sha256=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
              ;;
            aarch64-unknown-linux-gnu)
              rustup_host=aarch64-unknown-linux-gnu
              rustup_sha256=e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
              ;;
            *)
              echo "Unsupported rustup host for ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac
          rustup_init="$RUNNER_TEMP/rustup-init"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            "https://static.rust-lang.org/rustup/archive/1.28.2/${rustup_host}/rustup-init" \
            --output "$rustup_init"
          echo "${rustup_sha256}  ${rustup_init}" | sha256sum --check --strict
          chmod 0755 "$rustup_init"
          "$rustup_init" -y --profile minimal --default-toolchain 1.88.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add --toolchain 1.88.0 "${{ matrix.target }}"

          rustc_version="$("$HOME/.cargo/bin/rustc" +1.88.0 --version)"
          echo "$rustc_version"
          case "$rustc_version" in
            "rustc 1.88.0 "*) ;;
            *)
              echo "Expected rustc 1.88.0" >&2
              exit 1
              ;;
          esac

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ubuntu-20.04-${{ matrix.target }}

      # build-release.sh composes stable rustc --remap-path-prefix for the
      # workspace, HOME, CARGO_HOME and RUSTUP_HOME roots (Cargo 1.88 rejects
      # the unstable trim-paths profile key) and hands them to cargo via
      # CARGO_ENCODED_RUSTFLAGS, preserving incoming RUSTFLAGS such as the
      # Windows -C target-feature=+crt-static matrix flag.
      - name: Build rpi (release-dist)
        run: bash E2E.d/release/build-release.sh +1.88.0 build --package pi-cli --bin rpi --profile release-dist --locked --target ${{ matrix.target }}

      - name: Verify stripped release binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release-dist/rpi"
          [ -f "$src" ] || { echo "rpi binary not found at $src" >&2; exit 1; }

          bytes="$(wc -c < "$src" | tr -d '[:space:]')"
          echo "release binary: $src ($bytes bytes; limit $MAX_RELEASE_BINARY_BYTES)"
          if [ "$bytes" -gt "$MAX_RELEASE_BINARY_BYTES" ]; then
            echo "release binary exceeds the 64 MiB distribution limit" >&2
            exit 1
          fi

          sections="$RUNNER_TEMP/rpi-sections.txt"
          readelf -SW "$src" > "$sections"
          if grep -Eq '\.(z)?debug_|\.gnu_debuglink' "$sections"; then
            echo "Linux release binary still contains debug sections" >&2
            exit 1
          fi

      # Fails on any count above zero; prints counts per category only, never
      # the matching strings (the prefixes are builder paths).
      - name: Verify no builder path leakage
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          bash E2E.d/release/path-leak-check.sh \
            "target/${{ matrix.target }}/release-dist/rpi" \
            "HOME=$HOME" \
            "WORKSPACE=$GITHUB_WORKSPACE" \
            "CARGO_HOME=$cargo_home" \
            "RUSTUP_HOME=$rustup_home"

      - name: Smoke-test on glibc 2.31 baseline
        shell: bash
        run: target/${{ matrix.target }}/release-dist/rpi --version

      - name: Package archive (tar.gz)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="rpi-${version}-${{ matrix.target }}.tar.gz"
          staging="$(mktemp -d)"
          src="target/${{ matrix.target }}/release-dist/rpi"
          [ -f LICENSE ] || { echo "LICENSE is required in release archives" >&2; exit 1; }
          cp "$src" "$staging/rpi"
          chmod 0755 "$staging/rpi"
          cp LICENSE "$staging/"
          [ ! -f NOTICE ] || cp NOTICE "$staging/"
          tar -C "$staging" -czf "$archive" .
          sha256sum "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  build-native:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            expected_arch: arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            expected_arch: x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            expected_arch: AMD64
            rustflags: "-C target-feature=+crt-static"
    runs-on: ${{ matrix.os }}
    needs: [validate-release, build-web]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      # The embedded Web bundle is built once by build-web (dist/ is not
      # tracked by git); download it into the workspace before cargo build.
      - name: Download embedded Web bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: web-dist
          path: crates/pi-cli/web/dist

      - name: Verify native runner architecture
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            actual_arch="$PROCESSOR_ARCHITECTURE"
          else
            actual_arch="$(uname -m)"
          fi
          echo "Native build architecture: $actual_arch"
          if [ "$actual_arch" != "${{ matrix.expected_arch }}" ]; then
            echo "Expected native ${{ matrix.expected_arch }} execution" >&2
            exit 1
          fi


      - name: Install Rust 1.88.0
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add --toolchain 1.88.0 "${{ matrix.target }}"

          rustc_version="$(rustc +1.88.0 --version)"
          echo "$rustc_version"
          case "$rustc_version" in
            "rustc 1.88.0 "*) ;;
            *)
              echo "Expected rustc 1.88.0" >&2
              exit 1
              ;;
          esac

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      # build-release.sh/.ps1 compose stable rustc --remap-path-prefix for the
      # workspace, HOME, CARGO_HOME and RUSTUP_HOME roots (Cargo 1.88 rejects
      # the unstable trim-paths profile key) and hand them to cargo via
      # CARGO_ENCODED_RUSTFLAGS, preserving the incoming matrix RUSTFLAGS
      # (-C target-feature=+crt-static on Windows).
      - name: Build rpi (release-dist, macOS)
        if: runner.os != 'Windows'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: bash E2E.d/release/build-release.sh +1.88.0 build --package pi-cli --bin rpi --profile release-dist --locked --target ${{ matrix.target }}

      - name: Build rpi (release-dist, Windows)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: ./E2E.d/release/build-release.ps1 +1.88.0 build --package pi-cli --bin rpi --profile release-dist --locked --target ${{ matrix.target }}

      - name: Verify stripped release binary
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          src="target/${{ matrix.target }}/release-dist/rpi${suffix}"
          [ -f "$src" ] || { echo "rpi binary not found at $src" >&2; exit 1; }

          bytes="$(wc -c < "$src" | tr -d '[:space:]')"
          echo "release binary: $src ($bytes bytes; limit $MAX_RELEASE_BINARY_BYTES)"
          if [ "$bytes" -gt "$MAX_RELEASE_BINARY_BYTES" ]; then
            echo "release binary exceeds the 64 MiB distribution limit" >&2
            exit 1
          fi

      # Fails on any count above zero; prints counts per category only, never
      # the matching strings (the prefixes are builder paths).
      - name: Verify no builder path leakage (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          bash E2E.d/release/path-leak-check.sh \
            "target/${{ matrix.target }}/release-dist/rpi" \
            "HOME=$HOME" \
            "WORKSPACE=$GITHUB_WORKSPACE" \
            "CARGO_HOME=$cargo_home" \
            "RUSTUP_HOME=$rustup_home"

      - name: Verify no builder path leakage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $HOME '.rustup' }
          & ./E2E.d/release/path-leak-check.ps1 "target/${{ matrix.target }}/release-dist/rpi.exe" "HOME=$HOME" "WORKSPACE=$env:GITHUB_WORKSPACE" "CARGO_HOME=$cargoHome" "RUSTUP_HOME=$rustupHome"

      - name: Smoke-test the native binary (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: target/${{ matrix.target }}/release-dist/rpi --version

      - name: Smoke-test the native binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "target/${{ matrix.target }}/release-dist/rpi.exe"
          if (-not (Test-Path -LiteralPath $src)) { throw "rpi binary not found at $src" }
          & $src --version
          if ($LASTEXITCODE -ne 0) { throw "rpi --version exited $LASTEXITCODE" }

      - name: Package archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="rpi-${version}-${{ matrix.target }}.tar.gz"
          staging="$(mktemp -d)"
          src="target/${{ matrix.target }}/release-dist/rpi"
          [ -f LICENSE ] || { echo "LICENSE is required in release archives" >&2; exit 1; }
          cp "$src" "$staging/rpi"
          chmod 0755 "$staging/rpi"
          cp LICENSE "$staging/"
          [ ! -f NOTICE ] || cp NOTICE "$staging/"
          tar -C "$staging" -czf "$archive" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive"
          else
            shasum -a 256 "$archive"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Package archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $archive = "rpi-$version-${{ matrix.target }}.zip"
          $staging = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "staging") -Force
          if (-not (Test-Path -Path LICENSE -PathType Leaf)) {
            throw "LICENSE is required in release archives"
          }
          Copy-Item "target/${{ matrix.target }}/release-dist/rpi.exe" (Join-Path $staging "rpi.exe")
          Copy-Item LICENSE $staging
          if (Test-Path -Path NOTICE -PathType Leaf) { Copy-Item NOTICE $staging }
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $archive
          Get-FileHash -Algorithm SHA256 $archive
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$archive"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error


  package-desktop:
    name: package desktop (${{ matrix.asset_arch }})
    needs: [validate-release, build-linux, build-native]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            kind: deb
            asset_arch: amd64
            expected_arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            kind: deb
            asset_arch: arm64
            expected_arch: aarch64
          - os: macos-15
            target: aarch64-apple-darwin
            kind: mac
            asset_arch: aarch64-apple-darwin
            expected_arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            kind: mac
            asset_arch: x86_64-apple-darwin
            expected_arch: x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            kind: win
            asset_arch: x86_64-pc-windows-msvc
            expected_arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node for the desktop shell
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Name the matching CLI archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            ''|*' '*|*'/'*) echo "Release version is not a single path segment" >&2; exit 1 ;;
          esac
          ext="tar.gz"
          if [ "${{ matrix.kind }}" = "win" ]; then ext="zip"; fi
          {
            echo "RELEASE_VERSION=$version"
            echo "CLI_ARCHIVE=rpi-${version}-${{ matrix.target }}.${ext}"
          } >> "$GITHUB_ENV"

      - name: Download the matching CLI archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ env.CLI_ARCHIVE }}
          path: cli-archive

      - name: Install the bundled runner
        shell: bash
        run: |
          actual_arch="$(uname -m)"
          if [ "${{ runner.os }}" = "Windows" ]; then actual_arch="$PROCESSOR_ARCHITECTURE"; fi
          if [ "$actual_arch" != "${{ matrix.expected_arch }}" ]; then
            echo "Expected native ${{ matrix.expected_arch }} execution" >&2
            exit 1
          fi
          if [ "${{ matrix.kind }}" = "deb" ]; then
            sudo apt-get update
            sudo apt-get install -y file unzip
          fi
          mkdir -p target/release-dist
          archive="cli-archive/${CLI_ARCHIVE}"
          [ -f "$archive" ] || { echo "CLI archive missing: $archive" >&2; exit 1; }
          if [ "${{ matrix.kind }}" = "win" ]; then
            unzip -q "$archive" -d target/release-dist
            [ -f target/release-dist/rpi.exe ] || { echo "Windows archive has no rpi.exe" >&2; exit 1; }
          else
            tar -xzf "$archive" -C target/release-dist
            [ -f target/release-dist/rpi ] || { echo "Archive has no rpi" >&2; exit 1; }
            chmod 0755 target/release-dist/rpi
            case "${{ matrix.kind }}:${{ matrix.expected_arch }}" in
              deb:x86_64) file target/release-dist/rpi | grep -q 'x86-64' ;;
              deb:aarch64) file target/release-dist/rpi | grep -qi 'aarch64' ;;
              mac:arm64) file target/release-dist/rpi | grep -q 'arm64' ;;
              mac:x86_64) file target/release-dist/rpi | grep -q 'x86_64' ;;
              *) echo "No binary architecture check for this desktop package" >&2; exit 1 ;;
            esac
          fi

      - name: Install desktop dependencies
        working-directory: crates/pi-cli/desktop
        shell: bash
        run: npm ci

      - name: Package Linux deb
        if: matrix.kind == 'deb'
        shell: bash
        run: |
          export VERSION="$RELEASE_VERSION"
          bash crates/pi-cli/desktop/package-deb.sh "$RUNNER_TEMP/desktop-deb"
          asset="rpi-desktop-${RELEASE_VERSION}-${{ matrix.asset_arch }}.deb"
          cp "$RUNNER_TEMP/desktop-deb/rpi-desktop_${RELEASE_VERSION}_${{ matrix.asset_arch }}.deb" "$asset"
          sha256sum "$asset"
          echo "ARCHIVE=$asset" >> "$GITHUB_ENV"

      - name: Package macOS zip
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          export VERSION="$RELEASE_VERSION"
          export RPI_BINARY="$GITHUB_WORKSPACE/target/release-dist/rpi"
          asset="rpi-desktop-${RELEASE_VERSION}-${{ matrix.asset_arch }}.zip"
          bash crates/pi-cli/desktop/package-mac.sh "$asset"
          shasum -a 256 "$asset"
          echo "ARCHIVE=$asset" >> "$GITHUB_ENV"

      - name: Package Windows zip
        if: matrix.kind == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VERSION = $env:RELEASE_VERSION
          $env:RPI_BINARY = Join-Path $env:GITHUB_WORKSPACE 'target\release-dist\rpi.exe'
          $asset = "rpi-desktop-$env:RELEASE_VERSION-${{ matrix.asset_arch }}.zip"
          & ./crates/pi-cli/desktop/package-win.ps1 $asset
          if ($LASTEXITCODE -ne 0) { throw "package-win.ps1 exited $LASTEXITCODE" }
          Get-FileHash -Algorithm SHA256 $asset
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$asset"

      - name: Upload desktop package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  package-android:
    name: package Android APK
    needs: [validate-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node for the Android bundle
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install JDK 17 and Android SDK packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          java_version="$(java -version 2>&1 | awk -F '[".]' '/version/ {print $2; exit}')"
          case "$java_version" in
            17) ;;
            *) echo "Expected JDK 17, found major ${java_version:-unknown}" >&2; exit 1 ;;
          esac
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            echo "ANDROID_SDK_ROOT or ANDROID_HOME must point at the runner Android SDK" >&2
            exit 1
          fi
          sdkmanager="$(find "$sdk" -type f -path '*/cmdline-tools/*/bin/sdkmanager' | sort | tail -n 1)"
          [ -n "$sdkmanager" ] && [ -x "$sdkmanager" ] || { echo "sdkmanager is missing under $sdk/cmdline-tools" >&2; exit 1; }
          {
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_HOME=$sdk"
          } >> "$GITHUB_ENV"
          timeout 180 yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Write the release keystore from Actions secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, binascii, os, pathlib
          def prop(value: str) -> str:
              out = []
              for ch in value:
                  if ch in "\\ #!=" or ord(ch) < 32:
                      out.append("\\u%04x" % ord(ch))
                  else:
                      out.append(ch)
              return "".join(out)
          required = [
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Android release signing secrets are missing: " + ", ".join(missing))
          try:
              keystore = base64.b64decode("".join(os.environ["ANDROID_KEYSTORE_BASE64"].split()), validate=True)
          except binascii.Error:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid base64")
          if not keystore:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 decoded empty")
          dest = pathlib.Path("mobile/android/app/release.keystore")
          dest.write_bytes(keystore)
          dest.chmod(0o600)
          props = pathlib.Path("mobile/android/keystore.properties")
          props.write_text(
              "storeFile=app/release.keystore\n"
              f"storePassword={prop(os.environ['ANDROID_KEYSTORE_PASSWORD'])}\n"
              f"keyAlias={prop(os.environ['ANDROID_KEY_ALIAS'])}\n"
              f"keyPassword={prop(os.environ['ANDROID_KEY_PASSWORD'])}\n",
              encoding="utf-8",
          )
          props.chmod(0o600)
          PY

      - name: Assemble the release APK
        working-directory: mobile/android
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod 0600 local.properties
          ./gradlew :app:assembleRelease --no-daemon
          mapfile -t built < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'rpi-chat-*.apk' | sort)
          if [ "${#built[@]}" -ne 1 ] || [ ! -s "${built[0]}" ]; then
            echo "Expected one nonempty release APK" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          asset="$GITHUB_WORKSPACE/rpi-chat-${version}-android.apk"
          cp "${built[0]}" "$asset"
          sha256sum "$asset"
          echo "ARCHIVE=rpi-chat-${version}-android.apk" >> "$GITHUB_ENV"

      - name: Upload Android APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  sandbox-static-release:
    name: sandbox static release gates
    needs: [validate-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Install Rust 1.88.0
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustc_version="$(rustc +1.88.0 --version)"
          echo "$rustc_version"
          case "$rustc_version" in
            "rustc 1.88.0 "*) ;;
            *) echo "Expected rustc 1.88.0" >&2; exit 1 ;;
          esac

      - name: Run sandbox static release gates
        shell: bash
        run: |
          cargo +1.88.0 test --locked -p pi-coding --test raw_spawn_gate
          cargo +1.88.0 test --locked -p pi-coding --test sandbox_spawn_families
          cargo +1.88.0 test --locked -p pi-coding --test policy_fs
          cargo +1.88.0 test --locked -p pi-coding --test host_network
          cargo +1.88.0 test --locked -p pi-coding --test application_generation

  sandbox-linux-release:
    name: sandbox Linux release proof (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Install Rust 1.88.0
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustc_version="$(rustc +1.88.0 --version)"
          echo "$rustc_version"
          case "$rustc_version" in
            "rustc 1.88.0 "*) ;;
            *) echo "Expected rustc 1.88.0" >&2; exit 1 ;;
          esac


      - name: Build and verify bubblewrap 0.10.0
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential meson ninja-build libcap-dev
          bwrap_source="$RUNNER_TEMP/bubblewrap"
          git init "$bwrap_source"
          git -C "$bwrap_source" remote add origin https://github.com/containers/bubblewrap.git
          git -C "$bwrap_source" fetch --depth=1 origin dc63ec667e6546f34e0b6c088cdf8ae7c7dea0f3
          git -C "$bwrap_source" checkout --detach FETCH_HEAD
          [ "$(git -C "$bwrap_source" rev-parse HEAD)" = dc63ec667e6546f34e0b6c088cdf8ae7c7dea0f3 ]
          meson setup "$bwrap_source/build" "$bwrap_source" --buildtype=release --prefix=/usr
          ninja -C "$bwrap_source/build"
          sudo ninja -C "$bwrap_source/build" install
          [ "$(bwrap --version)" = "bubblewrap 0.10.0" ]
          E2E.d/ci/orchestration.sh __bubblewrap-fd-probe

      - name: Set up Node for Chromium
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install Playwright Chromium
        shell: bash
        run: |
          playwright_dir="$RUNNER_TEMP/sandbox-playwright"
          mkdir -p "$playwright_dir"
          cd "$playwright_dir"
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          chrome_path="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          [ -x "$chrome_path" ]
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Run Linux sandbox release proofs
        shell: bash
        run: |
          cargo +1.88.0 test --locked -p pi-sandbox --test linux_backend
          cargo +1.88.0 test --locked -p pi-sandbox --lib spawn::tests::owned_spawn_parts_are_consumed_exactly_once -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib unix::tests::wrapper_exec_preserves_only_declared_transport_fds -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib prepare::linux::tests::every_bwrap_argv_fd_survives_wrapper_exec -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib child::tests::linux_descriptor_exec_uses_prepared_inode_after_path_replacement -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib child::tests::all_governed_mappings_survive_and_sources_close_after_install -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib child::tests::status_eof_follows_exec_armed_frame_and_target_exec -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib unix::tests::wrapper_and_child_error_channels_have_distinct_close_owners -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib unix::tests::unrelated_fd_does_not_cross_wrapper_or_target_exec -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib spawn::tests::browser_target_fd_contract_is_exact -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib prepare::linux::tests::target_resolution_pins_inode -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib prepare::linux::tests::current_binary_uses_proc_self_exe_fd -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib bwrap::tests::argv_has_empty_root_and_literal_order -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib bwrap::tests::every_mount_source_is_fd_backed -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib launcher::tests::exec_uses_opened_bwrap_identity -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib prepare::linux::tests::prepared_plan_owns_duplicated_launcher -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib child::tests::child_request_rejects_zero_and_above_default_limits -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --lib child::tests::hidden_child_applies_limits_nnp_seccomp_then_exec -- --nocapture
          cargo +1.88.0 test --locked -p pi-sandbox --test pty_launcher -- --nocapture
          cargo +1.88.0 test --locked -p pi-coding --test browser_native_sandbox governed_debugging_pipe_returns_browser_version -- --nocapture

  sandbox-macos-release:
    name: sandbox macOS release proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
