          if (-not $rustcVersion.StartsWith('rustc 1.88.0 ')) { throw 'Expected rustc 1.88.0' }


      - name: Run Windows sandbox release proofs
        shell: pwsh
        run: |
          cargo +1.88.0 test --locked -p pi-cli --test windows_confined_unsupported
          cargo +1.88.0 test --locked -p pi-coding --test browser_native_sandbox windows_browser_is_rejected_before_approval -- --nocapture
          cargo +1.88.0 test --locked -p pi-coding --test policy_fs windows_file_identity_preserves_all_128_bits -- --nocapture
          cargo +1.88.0 test --locked -p pi-coding --test policy_fs windows_enumerated_and_opened_high_bits_cannot_collide -- --nocapture
          cargo +1.88.0 test --locked -p pi-coding --test policy_fs windows_replacement_rejects_high_bits_identity_swap -- --nocapture

  release:
    name: publish GitHub Release
    needs:
      - validate-release
      - sandbox-static-release
      - build-linux
      - build-native
      - package-desktop
      - package-android
      - sandbox-linux-release
      - sandbox-macos-release
      - sandbox-windows-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      # Download every CLI, desktop, and Android release file. `web-dist`
      # (the embedded web bundle shared into the build jobs) must NOT land in
      # the release staging dir. The exact-inventory check below requires the
      # eleven product files and nothing else.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: rpi-*
          merge-multiple: true

      - name: Verify exact local inventory and generate SHA256SUMS
        working-directory: dist
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A prerelease tag (semver with a '-' prerelease segment, ignoring
          # '+build' metadata) is published as prerelease=true, make_latest=false,
          # so /releases/latest (the installer default) never resolves to it.
          base="${version%%+*}"
          case "$base" in
            *-*) echo "IS_PRERELEASE=true"  >> "$GITHUB_ENV" ;;
            *)   echo "IS_PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac
          expected=(
            "rpi-${version}-aarch64-apple-darwin.tar.gz"
            "rpi-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "rpi-${version}-x86_64-apple-darwin.tar.gz"
            "rpi-${version}-x86_64-pc-windows-msvc.zip"
            "rpi-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "rpi-desktop-${version}-aarch64-apple-darwin.zip"
            "rpi-desktop-${version}-amd64.deb"
            "rpi-desktop-${version}-arm64.deb"
            "rpi-desktop-${version}-x86_64-apple-darwin.zip"
            "rpi-desktop-${version}-x86_64-pc-windows-msvc.zip"
            "rpi-chat-${version}-android.apk"
          )

          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets.txt"
          find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets.txt"
          if ! diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "Local release inventory is not exactly the eleven expected product files" >&2
            exit 1
          fi

          for asset in "${expected[@]}"; do
            [ -f "$asset" ] && [ -s "$asset" ] || {
              echo "Expected a nonempty regular file: $asset" >&2
              exit 1
            }
          done

          sha256sum "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Refuse published release and remove stale draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_rows="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | [.id, .tag_name, .draft] | @tsv'
          )"
          draft_ids=""
          published_exists=false
          while IFS=$'\t' read -r release_id tag is_draft; do
            [ "$tag" = "$GITHUB_REF_NAME" ] || continue
            if [ "$is_draft" = "true" ]; then
              draft_ids="${draft_ids}${release_id} "
            else
              published_exists=true
            fi
          done <<< "$release_rows"

          if [ "$published_exists" = true ]; then
            echo "Release $GITHUB_REF_NAME is already published; refusing to replace its assets" >&2
            exit 1
          fi

          set -- $draft_ids
          draft_count="$#"
          if [ "$draft_count" -gt 1 ]; then
            echo "Found multiple drafts for $GITHUB_REF_NAME; refusing ambiguous cleanup" >&2
            exit 1
          fi
          if [ "$draft_count" -eq 1 ]; then
            stale_draft_id="$1"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${stale_draft_id}"
          fi

      - name: Create or update draft release
        id: draft_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
          draft: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: false
          overwrite_files: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## rpi `${{ github.ref_name }}`

            Checksums for every file below are in `SHA256SUMS`.

            ### CLI

            Platforms: Linux x86_64, Linux aarch64, macOS arm64, macOS x86_64, Windows x86_64.

            Archives are `rpi-<version>-<target-triple>.tar.gz` (Windows is `.zip`). Each contains `rpi` or `rpi.exe` plus `LICENSE`.

            ```sh
            # macOS / Linux — installer source pinned to this release commit; candidate pinned to this release tag
            curl -fsSL https://raw.githubusercontent.com/0x8f701/rpi/${{ github.sha }}/install.sh | bash -s -- --version ${{ github.ref_name }}
            ```

            ```powershell
            # Windows PowerShell — installer source pinned to this release commit; candidate pinned to this release tag
            & ([scriptblock]::Create((irm https://raw.githubusercontent.com/0x8f701/rpi/${{ github.sha }}/install.ps1))) -Version ${{ github.ref_name }}
            ```

            ### Desktop

            Platforms: Linux amd64 `.deb`, Linux arm64 `.deb`, macOS arm64 `.zip`, macOS x86_64 `.zip`, Windows x86_64 `.zip`.

            Each desktop package bundles the CLI binary for that same platform. Linux: `dpkg -i rpi-desktop-<version>-amd64.deb` or `dpkg -i rpi-desktop-<version>-arm64.deb`. macOS: unzip `rpi-desktop-<version>-aarch64-apple-darwin.zip` or the x86_64 zip and open `rpi-desktop.app`. Windows: unzip `rpi-desktop-<version>-x86_64-pc-windows-msvc.zip` and run `rpi-desktop\electron.exe`. These desktop packages are not code-signed or notarized.

            ### Mobile

            Android: `rpi-chat-<version>-android.apk` is one sideload APK containing `armeabi-v7a`, `arm64-v8a`, `x86`, and `x86_64`. It is signed with the release keystore supplied to Actions. The application id is `com.rpichat`, versionName `1.0.0`, versionCode `5`. iOS is not published.

      - name: Verify remote draft inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=(
            SHA256SUMS
            "rpi-${version}-aarch64-apple-darwin.tar.gz"
            "rpi-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "rpi-${version}-x86_64-apple-darwin.tar.gz"
            "rpi-${version}-x86_64-pc-windows-msvc.zip"
            "rpi-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "rpi-desktop-${version}-aarch64-apple-darwin.zip"
            "rpi-desktop-${version}-amd64.deb"
            "rpi-desktop-${version}-arm64.deb"
            "rpi-desktop-${version}-x86_64-apple-darwin.zip"
            "rpi-desktop-${version}-x86_64-pc-windows-msvc.zip"
            "rpi-chat-${version}-android.apk"
          )
          release_id="${{ steps.draft_release.outputs.id }}"
          case "$release_id" in
            ''|*[!0-9]*)
              echo "Release action returned an invalid draft release ID: $release_id" >&2
              exit 1
              ;;
          esac
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"

          if ! jq -e --arg tag "$GITHUB_REF_NAME" --arg ispre "$IS_PRERELEASE" \
            '(.tag_name == $tag) and (.draft == true) and (.prerelease == ($ispre == "true")) and
             (.assets | length == 12) and all(.assets[]; .size > 0)' \
            <<< "$release_json" >/dev/null; then
            echo "Remote release is not a draft with twelve nonempty assets" >&2
            exit 1
          fi

          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected-remote-assets.txt"
          jq -r '.assets[].name' <<< "$release_json" | LC_ALL=C sort > "$RUNNER_TEMP/actual-remote-assets.txt"
          if ! diff -u "$RUNNER_TEMP/expected-remote-assets.txt" "$RUNNER_TEMP/actual-remote-assets.txt"; then
            echo "Remote draft inventory is not exactly the eleven product files plus SHA256SUMS" >&2
            exit 1
          fi

          verify_dir="$(mktemp -d)"
          jq -r '.assets[] | [.name, .url] | @tsv' <<< "$release_json" |
            while IFS=$'\t' read -r asset_name asset_api_url; do
              gh api -H 'Accept: application/octet-stream' "$asset_api_url" \
                > "$verify_dir/$asset_name"
            done
          (cd "$verify_dir" && sha256sum -c SHA256SUMS)

      - name: Publish verified release and set latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        shell: bash
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            MAKE_LATEST=false
          else
            MAKE_LATEST=true
          fi
          # Stable releases become the latest; prereleases stay non-latest so
          # the installers' /releases/latest default keeps resolving to stable.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f draft=false \
            -F prerelease="$IS_PRERELEASE" \
            -f make_latest="$MAKE_LATEST" >/dev/null