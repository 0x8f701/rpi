      - name: Install Playwright Chromium
        shell: bash
        run: |
          playwright_dir="$RUNNER_TEMP/sandbox-playwright"
          mkdir -p "$playwright_dir"
          cd "$playwright_dir"
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          chrome_path="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          [ -x "$chrome_path" ]
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Run macOS sandbox release proofs
        shell: bash
        run: |
