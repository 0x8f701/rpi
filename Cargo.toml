[workspace]
members = ["crates/pi-ai", "crates/pi-agent", "crates/pi-coding", "crates/pi-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
similar = "3.1"
globset = "0.4"
ignore = "0.4"
pi-ai = { path = "crates/pi-ai" }
pi-agent = { path = "crates/pi-agent" }
pi-coding = { path = "crates/pi-coding" }
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }
regex = "1.11"
portable-pty = "0.9"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
semver = "1.0"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.45", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5"
uuid = { version = "1.16", features = ["serde", "v4", "v7"] }
walkdir = "2.5"
http = "1.3"
# Image decode/encode/resize for the read tool's image pipeline (faithful port of
# pi's processImage/resizeImage). BMP/WebP/PNG/JPEG/GIF decode + Lanczos3 resize.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Unicode NFKC (fuzzy edit matching) + NFD (macOS filename fallback) for the
# faithful port of pi's normalizeForFuzzyMatch and resolveReadPath.
unicode-normalization = "0.1"
# Fast, poison-free sync locks (project rule: prefer parking_lot over
# std::sync::Mutex when the guard is immediately unwrapped).
parking_lot = "0.12"
unicode-width = "0.2"

[profile.release-dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = 0
split-debuginfo = "off"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
