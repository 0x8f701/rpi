[package]
name = "pi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pi_cli"
path = "src/lib.rs"

[[bin]]
name = "rpi"
path = "src/main.rs"


[[test]]
name = "windows_confined_unsupported"
path = "tests/windows_confined_unsupported.rs"
harness = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
futures-util.workspace = true
globset.workspace = true
http.workspace = true
image.workspace = true
ignore.workspace = true
nix = { workspace = true, features = ["fs"] }
pi-ai.workspace = true
pi-agent.workspace = true
pi-coding.workspace = true
pi-sandbox.workspace = true
parking_lot.workspace = true
ratatui.workspace = true
rcgen.workspace = true
reqwest.workspace = true
rustls-pemfile.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
mdns-sd.workspace = true
tokio-util.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
portable-pty.workspace = true
qrcode.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Protocol-owner tests inject synthetic ApplicationEvent values into the
# existing broadcast channel; production does not enable this feature.
pi-coding = { workspace = true, features = ["test-support"] }
# Local-tarball plugin install e2e (`rpi plugin install <local>.tgz`).
tar.workspace = true
flate2.workspace = true

[lints]
workspace = true