[features]
# cpal-backed microphone capture for /live. Off by default because cpal
# links system ALSA on Linux (libasound2-dev required to build). Without the
# feature, /live still runs — the STT client, Ptt state machine, watchdog,
# and settings all work — but mic capture reports an actionable
# "not compiled in" error.
live-capture = ["dep:cpal"]

